name: Nightly Electron Build

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build web app + Electron (mac)
        run: npm run electron:dist
      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: release/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build web app + Electron (windows)
        run: npm run electron:dist
      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release/*

  create-release:
    name: Create nightly tag & release
    runs-on: ubuntu-latest
    needs: [ build-macos, build-windows ]
    steps:
      - uses: actions/checkout@v4
      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: artifacts/mac
      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows
      - name: Create tag name
        id: tag
        run: |
          TAG="nightly-$(date -u +'%Y%m%d-%H%M')-run${GITHUB_RUN_NUMBER}"
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT
      - name: Create Release and upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: ${{ steps.tag.outputs.TAG_NAME }}
          files: |
            artifacts/mac/**
            artifacts/windows/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
